<svg width="900" height="620" viewBox="0 0 900 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="900" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDF2F7"/>
      <stop offset="1" stop-color="#DCE3EA"/>
    </linearGradient>
    <radialGradient id="mint-glow" cx="65%" cy="38%" r="40%" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FD4A9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2FD4A9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C4CDD7" stroke-width="0.6"/>
    </pattern>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="36" fill="url(#bg-grad)"/>
  <rect width="900" height="620" rx="36" fill="url(#g)" opacity="0.45"/>
  <rect width="900" height="620" rx="36" fill="url(#mint-glow)"/>

  <!-- Mint orb -->
  <circle cx="680" cy="155" r="105" fill="#2FD4A9" fill-opacity="0.17"/>
  <circle cx="680" cy="155" r="62" fill="#2FD4A9" fill-opacity="0.22"/>

  <!-- Editor window -->
  <rect x="45" y="55" width="480" height="320" rx="20" fill="white" fill-opacity="0.88" filter="url(#soft-shadow)"/>

  <!-- Title bar -->
  <rect x="45" y="55" width="480" height="46" rx="20" fill="#F0F4F8"/>
  <rect x="45" y="77" width="480" height="24" fill="#F0F4F8"/>
  <circle cx="78"  cy="78" r="8" fill="#FF6B6B" fill-opacity="0.85"/>
  <circle cx="104" cy="78" r="8" fill="#FFD93D" fill-opacity="0.85"/>
  <circle cx="130" cy="78" r="8" fill="#6BCB77" fill-opacity="0.85"/>
  <rect x="165" y="68" width="200" height="18" rx="9" fill="#E2E8F0"/>

  <!-- Line numbers strip -->
  <rect x="45" y="101" width="36" height="274" fill="#EEF2F6"/>
  <rect x="58" y="116" width="12" height="8" rx="4" fill="#B0BBC8"/>
  <rect x="58" y="138" width="12" height="8" rx="4" fill="#B0BBC8"/>
  <rect x="58" y="160" width="12" height="8" rx="4" fill="#B0BBC8"/>
  <rect x="58" y="182" width="12" height="8" rx="4" fill="#B0BBC8"/>
  <rect x="58" y="204" width="12" height="8" rx="4" fill="#B0BBC8"/>
  <rect x="58" y="226" width="12" height="8" rx="4" fill="#B0BBC8"/>
  <rect x="58" y="248" width="12" height="8" rx="4" fill="#B0BBC8"/>
  <rect x="58" y="270" width="12" height="8" rx="4" fill="#B0BBC8"/>
  <rect x="58" y="292" width="12" height="8" rx="4" fill="#B0BBC8"/>
  <rect x="58" y="314" width="12" height="8" rx="4" fill="#B0BBC8"/>
  <rect x="58" y="336" width="12" height="8" rx="4" fill="#B0BBC8"/>

  <!-- Code lines  -->
  <!-- Line 1: import keyword  -->
  <rect x="92" y="113" width="52"  height="11" rx="5" fill="#2FD4A9"/>
  <rect x="152" y="113" width="130" height="11" rx="5" fill="#B8C7D6"/>
  <rect x="290" y="113" width="52"  height="11" rx="5" fill="#2FD4A9"/>

  <!-- Line 2 blank -->

  <!-- Line 3 keyword  -->
  <rect x="92"  y="157" width="48"  height="11" rx="5" fill="#2FD4A9"/>
  <rect x="148" y="157" width="92"  height="11" rx="5" fill="#698AAE"/>
  <rect x="248" y="157" width="14"  height="11" rx="5" fill="#B8C7D6"/>

  <!-- Line 4 indent -->
  <rect x="108" y="179" width="56"  height="11" rx="5" fill="#2FD4A9" fill-opacity="0.75"/>
  <rect x="172" y="179" width="108" height="11" rx="5" fill="#B8C7D6"/>
  <rect x="288" y="179" width="50"  height="11" rx="5" fill="#698AAE"/>

  <!-- Line 5 indent -->
  <rect x="108" y="201" width="36"  height="11" rx="5" fill="#2FD4A9" fill-opacity="0.55"/>
  <rect x="152" y="201" width="160" height="11" rx="5" fill="#B8C7D6"/>

  <!-- Line 6 blank -->

  <!-- Line 7: return keyword -->
  <rect x="108" y="245" width="52"  height="11" rx="5" fill="#2FD4A9"/>
  <rect x="168" y="245" width="72"  height="11" rx="5" fill="#698AAE"/>

  <!-- Line 8  -->
  <rect x="124" y="267" width="130" height="11" rx="5" fill="#B8C7D6"/>
  <rect x="262" y="267" width="80"  height="11" rx="5" fill="#2FD4A9" fill-opacity="0.65"/>

  <!-- Line 9 closing bracket -->
  <rect x="108" y="289" width="12"  height="11" rx="5" fill="#B8C7D6"/>

  <!-- closing curly -->
  <rect x="92"  y="311" width="12"  height="11" rx="5" fill="#B8C7D6"/>

  <!-- Cursor blink line -->
  <rect x="92" y="333" width="3" height="14" rx="1.5" fill="#2FD4A9"/>

  <!-- Tech stack pill badges floating below editor -->
  <rect x="45"  y="410" width="98"  height="34" rx="17" fill="white" fill-opacity="0.82"/>
  <text x="94"  y="432" text-anchor="middle" fill="#2FD4A9" font-size="12" font-weight="700" font-family="monospace">Java</text>

  <rect x="155" y="410" width="138" height="34" rx="17" fill="white" fill-opacity="0.82"/>
  <text x="224" y="432" text-anchor="middle" fill="#2FD4A9" font-size="12" font-weight="700" font-family="monospace">Spring Boot</text>

  <rect x="305" y="410" width="96"  height="34" rx="17" fill="white" fill-opacity="0.82"/>
  <text x="353" y="432" text-anchor="middle" fill="#2FD4A9" font-size="12" font-weight="700" font-family="monospace">React</text>

  <rect x="413" y="410" width="112" height="34" rx="17" fill="white" fill-opacity="0.82"/>
  <text x="469" y="432" text-anchor="middle" fill="#2FD4A9" font-size="12" font-weight="700" font-family="monospace">Docker</text>

  <!-- Small decorative element top right -->
  <circle cx="800" cy="490" r="54" fill="#98A4B2" fill-opacity="0.2"/>
  <circle cx="810" cy="75"  r="32" fill="#2FD4A9" fill-opacity="0.13"/>

  <!-- Dashed connection line editor → badges row -->
  <path d="M 290 376 Q 300 400 305 410" stroke="#2FD4A9" stroke-width="2" stroke-dasharray="5 4" fill="none" stroke-opacity="0.5"/>

  <!-- Terminal mini-panel bottom-right -->
  <rect x="570" y="340" width="280" height="190" rx="18" fill="#0F1318" fill-opacity="0.88" filter="url(#soft-shadow)"/>
  <rect x="570" y="340" width="280" height="34" rx="18" fill="#1C2531"/>
  <rect x="570" y="356" width="280" height="18" fill="#1C2531"/>
  <circle cx="596" cy="357" r="5" fill="#FF6B6B" fill-opacity="0.7"/>
  <circle cx="614" cy="357" r="5" fill="#FFD93D" fill-opacity="0.7"/>
  <circle cx="632" cy="357" r="5" fill="#6BCB77" fill-opacity="0.7"/>

  <rect x="590" y="392" width="16"  height="9" rx="4" fill="#2FD4A9"/>
  <rect x="614" y="392" width="140" height="9" rx="4" fill="#4A5568"/>

  <rect x="590" y="416" width="220" height="9" rx="4" fill="#3D4F61"/>
  <rect x="590" y="440" width="180" height="9" rx="4" fill="#3D4F61"/>
  <rect x="590" y="464" width="100" height="9" rx="4" fill="#2FD4A9" fill-opacity="0.7"/>
  <rect x="698" y="464" width="3"   height="12" rx="1.5" fill="#2FD4A9"/>
  <rect x="590" y="488" width="150" height="9" rx="4" fill="#3D4F61"/>
</svg>
